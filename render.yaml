services:
  # ===================================================
  # 1. PFIS Backend Web Service (Render Node.js Service)
  # ===================================================
  - type: web
    name: pfis-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false # Set to your actual Render frontend URL (e.g. https://pfis-frontend.onrender.com)
      - key: SERVER_URL
        value: https://pfis-patient-friction-intelligence-system.onrender.com
      - key: GOOGLE_CALLBACK_URL
        value: https://pfis-patient-friction-intelligence-system.onrender.com/api/auth/google/callback
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_TYPE
        value: auto
      - key: MAX_FILE_SIZE_MB
        value: "10"

  # ===================================================
  # 2. PFIS Frontend Static Site (Render Static Site)
  # ===================================================
  - type: static
    name: pfis-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pfis-patient-friction-intelligence-system.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
