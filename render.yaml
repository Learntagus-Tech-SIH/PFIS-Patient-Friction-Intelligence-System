services:
  # ===================================================
  # 1. PFIS Backend Web Service (Render Node.js Service)
  # ===================================================
  - type: web
    name: pfis-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://pfis-patient-friction-intelligence.onrender.com
      - key: SERVER_URL
        value: https://pfis-patient-friction-intelligence-system.onrender.com
      - key: GOOGLE_CALLBACK_URL
        value: https://pfis-patient-friction-intelligence-system.onrender.com/api/auth/google/callback
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_TYPE
        value: auto
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: ABDM_MODE
        value: sandbox
      - key: ABDM_BASE_URL
        value: https://dev.abdm.gov.in/api/v1
      - key: ABDM_CLIENT_ID
        sync: false
      - key: ABDM_CLIENT_SECRET
        sync: false
      - key: ABDM_REDIRECT_URI
        value: https://pfis-patient-friction-intelligence-system.onrender.com/api/integrations/abdm/callback
      - key: ABDM_HFR_ENABLED
        value: "true"
      - key: ABDM_HPR_ENABLED
        value: "true"
      - key: ABDM_ABHA_ENABLED
        value: "true"
      - key: ABDM_CONSENT_ENABLED
        value: "true"
      - key: ABDM_HEALTH_RECORDS_ENABLED
        value: "true"
      - key: ABDM_TIMEOUT_MS
        value: "15000"


  # ===================================================
  # 2. PFIS Frontend Static Site (Render Static Site)
  # ===================================================
  - type: web
    name: pfis-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pfis-patient-friction-intelligence-system.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

